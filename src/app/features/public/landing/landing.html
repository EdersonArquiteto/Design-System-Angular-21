<div class="relative min-h-screen bg-transparent">
  <div class="pointer-events-none absolute inset-0 overflow-hidden">
    <div class="absolute -top-40 left-1/2 h-[34rem] w-[34rem] -translate-x-1/2 rounded-full bg-emerald-500/18 blur-3xl"></div>
    <div class="absolute -bottom-44 left-1/3 h-[30rem] w-[30rem] -translate-x-1/2 rounded-full bg-teal-400/12 blur-3xl"></div>
    <div class="absolute -bottom-24 right-1/4 h-[26rem] w-[26rem] rounded-full bg-cyan-400/8 blur-3xl"></div>
    <div class="absolute inset-0 bg-[radial-gradient(ellipse_at_top,rgba(255,255,255,0.05),transparent_60%)]"></div>
  </div>

  <header class="relative z-10 border-b border-white/10 bg-white/[0.04] backdrop-blur-2xl">
    <div class="mx-auto flex max-w-6xl items-center justify-between gap-4 px-6 py-4">
      <a
        class="block"
        [href]="env.company.websiteUrl"
        target="_blank"
        rel="noopener noreferrer"
        aria-label="Abrir site da The One"
      >
        <img class="h-10 w-auto object-contain" [src]="env.assets.logoTheOne" alt="The One Software" />
      </a>

      <a
        routerLink="/login"
        class="inline-flex items-center justify-center rounded-xl px-5 py-2.5 font-semibold text-white shadow-lg transition active:scale-95"
        style="background: var(--color-primary)"
      >
        Área Logada
      </a>
    </div>
  </header>

  <main class="relative z-10 mx-auto flex max-w-6xl flex-col items-center px-6 py-16 text-center">
    <div class="relative w-full max-w-2xl">
      <div class="pointer-events-none absolute -inset-6 rounded-[2.5rem] bg-gradient-to-r from-emerald-500/30 via-teal-400/15 to-cyan-400/20 blur-3xl opacity-80"></div>

      <section class="relative overflow-hidden rounded-[2rem] border border-white/10 bg-white/[0.04] p-10 shadow-[0_30px_80px_rgba(0,0,0,0.55)] backdrop-blur-2xl">
        <h1 class="text-4xl font-semibold tracking-tight text-white md:text-5xl">Página em construção</h1>
        <p class="mt-4 text-base text-slate-300 md:text-lg">
          Em breve teremos conteúdo aqui. Enquanto isso, você pode acessar a área logada para navegar no sistema.
        </p>
        <div class="mt-10 flex items-center justify-center gap-3">
          <a
            routerLink="/login"
            class="inline-flex items-center justify-center rounded-xl px-6 py-3 font-semibold text-white shadow-lg transition active:scale-95"
            style="background: var(--color-primary)"
          >
            Acessar Área Logada
          </a>
          <a
            class="inline-flex items-center justify-center rounded-xl border border-white/10 bg-white/[0.04] px-6 py-3 font-semibold text-slate-200 backdrop-blur transition hover:bg-white/[0.07] active:scale-95"
            [href]="env.company.websiteUrl"
            target="_blank"
            rel="noopener noreferrer"
          >
            Conhecer a The One
          </a>
        </div>
      </section>
    </div>
  </main>

  <footer class="relative z-10 mt-auto border-t border-white/10 bg-white/[0.03] backdrop-blur-2xl">
    <div class="mx-auto flex max-w-6xl flex-col items-center justify-between gap-3 px-6 py-6 text-center sm:flex-row sm:text-left">
      <a
        class="block opacity-90 transition hover:opacity-100"
        [href]="env.company.websiteUrl"
        target="_blank"
        rel="noopener noreferrer"
      >
        <img class="h-8 w-auto object-contain" [src]="env.assets.logoTheOne" alt="The One Software" />
      </a>
      <p class="text-xs text-slate-400">
        © {{ year }} · The One Software
      </p>
    </div>
  </footer>
</div>

<div class="relative min-h-screen bg-slate-950 px-4 py-10">
  <div class="pointer-events-none absolute inset-0 overflow-hidden">
    <div class="absolute -top-40 left-1/2 h-[34rem] w-[34rem] -translate-x-1/2 rounded-full bg-emerald-500/15 blur-3xl"></div>
    <div class="absolute -bottom-40 left-1/3 h-[30rem] w-[30rem] -translate-x-1/2 rounded-full bg-sky-500/10 blur-3xl"></div>
    <div class="absolute inset-0 bg-[radial-gradient(ellipse_at_top,rgba(255,255,255,0.05),transparent_60%)]"></div>
  </div>

  <div class="relative mx-auto flex min-h-[calc(100vh-5rem)] max-w-md items-center">
    <div class="w-full overflow-hidden rounded-[2.5rem] border border-white/10 bg-white/[0.04] shadow-[0_30px_80px_rgba(0,0,0,0.55)] backdrop-blur-2xl">
      <div class="border-b border-white/10 bg-white/[0.02] px-10 py-7">
        <a
          class="group inline-flex items-center gap-3"
          [href]="env.company.websiteUrl"
          target="_blank"
          rel="noopener noreferrer"
          [attr.aria-label]="'Acessar site: ' + env.company.websiteUrl"
        >
          <span class="relative grid h-10 w-10 place-items-center rounded-2xl bg-white/[0.06] ring-1 ring-white/10">
            <span class="absolute inset-0 rounded-2xl bg-gradient-to-br from-emerald-500/20 to-sky-500/10 opacity-0 transition-opacity duration-300 group-hover:opacity-100"></span>
            <span class="relative text-xs font-semibold tracking-wider text-slate-200">DS</span>
          </span>
          <img
            class="h-8 w-auto object-contain opacity-90 transition group-hover:opacity-100"
            [src]="env.assets.logoTheOne"
            alt="The One Software"
          />
        </a>
        <p class="mt-3 text-xs font-medium tracking-wide text-slate-400">
          {{ env.appName }}
        </p>
      </div>
      
      @if (!sent()) {
        <div class="px-10 pb-10 pt-8">
        <header class="mb-8 text-left">
          <h2 class="text-3xl font-semibold tracking-tight text-white mb-2">Recuperar Senha</h2>
          <p class="text-slate-400 text-sm">Insira seu e-mail para receber as instruções de redefinição.</p>
        </header>

        <form [formGroup]="forgotForm" (ngSubmit)="onSubmit()">
          <ds-form-field [error]="forgotForm.get('email')?.touched && forgotForm.get('email')?.invalid ? 'E-mail inválido' : null">
            <ds-input label="E-mail de recuperação" formControlName="email" placeholder="seu@email.com"></ds-input>
          </ds-form-field>

          <button ds-button class="primary w-full mt-6 py-4">Enviar Link</button>
        </form>
        </div>
      } @else {
        <div class="px-10 pb-10 pt-8 text-center animate-in fade-in zoom-in duration-500">
          <div class="w-20 h-20 bg-green-500/20 text-green-400 rounded-full flex items-center justify-center mx-auto mb-6">
            <svg class="w-10 h-10" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7" />
            </svg>
          </div>
          <h2 class="text-2xl font-bold text-white mb-2">E-mail Enviado!</h2>
          <p class="text-slate-400 mb-8">Verifique sua caixa de entrada para continuar.</p>
          <button ds-button class="glass w-full" (click)="sent.set(false)">Voltar</button>
        </div>
      }

      <div class="mt-8 text-center">
        <a routerLink="/login" class="text-sm text-slate-500 hover:text-white transition-colors">Voltar para o Login</a>
      </div>
    </div>
  </div>
</div>

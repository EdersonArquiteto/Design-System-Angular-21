<div class="relative min-h-screen bg-slate-950 px-4 py-10">
  <div class="pointer-events-none absolute inset-0 overflow-hidden">
    <div class="absolute -top-40 left-1/2 h-[34rem] w-[34rem] -translate-x-1/2 rounded-full bg-emerald-500/15 blur-3xl"></div>
    <div class="absolute -bottom-40 left-1/3 h-[30rem] w-[30rem] -translate-x-1/2 rounded-full bg-sky-500/10 blur-3xl"></div>
    <div class="absolute inset-0 bg-[radial-gradient(ellipse_at_top,rgba(255,255,255,0.05),transparent_60%)]"></div>
  </div>

  <div class="relative mx-auto flex min-h-[calc(100vh-5rem)] max-w-lg items-center">
    <div class="w-full overflow-hidden rounded-[2.5rem] border border-white/10 bg-white/[0.04] shadow-[0_30px_80px_rgba(0,0,0,0.55)] backdrop-blur-2xl">
      <div class="border-b border-white/10 bg-white/[0.02] px-10 py-8">
        <a
          class="group mx-auto block w-fit"
          [href]="env.company.websiteUrl"
          target="_blank"
          rel="noopener noreferrer"
          [attr.aria-label]="'Acessar site: ' + env.company.websiteUrl"
        >
          <span class="relative block rounded-2xl bg-slate-950/60 p-3 ring-1 ring-white/10 shadow-[0_12px_40px_rgba(0,0,0,0.45)] backdrop-blur-md transition group-hover:ring-white/20">
            <span class="pointer-events-none absolute inset-0 rounded-2xl bg-gradient-to-br from-emerald-500/10 via-transparent to-sky-500/10 opacity-0 transition-opacity duration-300 group-hover:opacity-100"></span>
            <img
              class="relative h-9 w-auto max-w-[14rem] object-contain"
              [src]="env.assets.logoTheOne"
              alt="The One Software"
            />
          </span>
        </a>
      </div>
      
      <div class="px-10 pb-10 pt-8">
        <h2 class="text-3xl font-semibold tracking-tight text-white mb-6">Criar nova conta</h2>

        <form [formGroup]="registerForm" (ngSubmit)="onRegister()" class="grid grid-cols-1 md:grid-cols-2 gap-4">
        
        <ds-form-field class="md:col-span-2">
          <ds-input label="Nome Completo" formControlName="name" placeholder="Ex: João Silva"></ds-input>
        </ds-form-field>

        <ds-form-field class="md:col-span-2" [error]="emailError">
          <ds-input label="E-mail" type="email" formControlName="email" placeholder="seu@email.com"></ds-input>
        </ds-form-field>

        <ds-form-field [error]="registerForm.get('password')?.touched && registerForm.get('password')?.invalid ? 'Senha fraca' : null">
          <ds-input label="Senha" type="password" formControlName="password" placeholder="••••••"></ds-input>
        </ds-form-field>

        <ds-form-field [error]="registerForm.errors?.['mismatch'] && registerForm.get('confirmPassword')?.touched ? 'As senhas não coincidem' : null">
          <ds-input label="Confirmar Senha" type="password" formControlName="confirmPassword" placeholder="••••••"></ds-input>
        </ds-form-field>

        <button ds-button class="primary md:col-span-2 mt-4 py-4">
          Registrar Agora
        </button>
      </form>

      <p class="text-center mt-6 text-slate-400">
        Já tem conta? <a routerLink="/login" class="text-blue-400">Voltar ao login</a>
      </p>
      </div>
    </div>
  </div>
</div>

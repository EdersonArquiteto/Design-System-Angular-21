<div class="min-h-screen flex items-center justify-center bg-slate-950 px-4">
    <div class="w-full max-w-md bg-white/[0.02] backdrop-blur-3xl border border-white/10 p-10 rounded-[2rem] shadow-2xl">
      <div class="mb-8 flex items-center justify-between gap-6">
        <div class="min-w-0">
          <img
            class="h-10 w-auto object-contain"
            [src]="env.assets.logoProduto"
            [alt]="env.appName"
          />
          <p class="mt-2 truncate text-sm font-semibold text-white">{{ env.appName }}</p>
        </div>

        <a
          class="shrink-0 opacity-90 transition hover:opacity-100"
          [href]="env.company.websiteUrl"
          target="_blank"
          rel="noopener noreferrer"
          [attr.aria-label]="'Acessar site: ' + env.company.websiteUrl"
        >
          <img
            class="h-9 w-auto object-contain"
            [src]="env.assets.logoTheOne"
            alt="The One Software"
          />
        </a>
      </div>
      
      <header class="text-center mb-10">
        <h1 class="text-3xl font-bold text-white mb-2">Bem-vindo de volta</h1>
        <p class="text-slate-400">Entre com suas credenciais para acessar o painel</p>
      </header>

      <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="flex flex-col gap-2">
        
        <ds-form-field [error]="emailError">
          <ds-input 
            label="E-mail" 
            placeholder="exemplo@email.com" 
            formControlName="email">
          </ds-input>
        </ds-form-field>

        <ds-form-field [error]="passwordError">
          <ds-input 
            label="Senha" 
            type="password" 
            placeholder="••••••••" 
            formControlName="password">
          </ds-input>
        </ds-form-field>

        <div class="flex justify-end mb-4">
          <a routerLink="/forgot-password" class="text-sm text-blue-400 hover:underline">Esqueceu a senha?</a>
        </div>

        <button ds-button class="primary w-full py-4 text-lg">
          Acessar Sistema
        </button>
      </form>

      <footer class="mt-8 text-center">
        <p class="text-slate-500">Não tem uma conta? 
          <a routerLink="/register" class="text-white font-medium hover:text-blue-400 transition-colors">Criar agora</a>
        </p>
      </footer>
    </div>
  </div>

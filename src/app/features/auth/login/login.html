<div class="relative min-h-screen bg-transparent px-4 py-10">
  <div class="pointer-events-none absolute inset-0 overflow-hidden">
    <div class="absolute -top-40 left-1/2 h-[34rem] w-[34rem] -translate-x-1/2 rounded-full bg-emerald-500/18 blur-3xl"></div>
    <div class="absolute -bottom-44 left-1/3 h-[30rem] w-[30rem] -translate-x-1/2 rounded-full bg-teal-400/12 blur-3xl"></div>
    <div class="absolute -bottom-24 right-1/4 h-[26rem] w-[26rem] rounded-full bg-cyan-400/8 blur-3xl"></div>
    <div class="absolute inset-0 bg-[radial-gradient(ellipse_at_top,rgba(255,255,255,0.05),transparent_60%)]"></div>
  </div>

  <div class="relative mx-auto flex min-h-[calc(100vh-5rem)] max-w-md items-center">
    <div class="relative w-full">
      <!-- Glow / luminosidade -->
      <div class="pointer-events-none absolute -inset-4 rounded-[2.5rem] bg-gradient-to-r from-emerald-500/30 via-teal-400/15 to-cyan-400/20 blur-3xl opacity-80"></div>
      <div class="pointer-events-none absolute -inset-0.5 rounded-[2.1rem] bg-gradient-to-b from-white/10 to-transparent opacity-70"></div>

      <div class="relative w-full overflow-hidden rounded-[2rem] border border-white/10 bg-white/[0.04] shadow-[0_30px_80px_rgba(0,0,0,0.55)] backdrop-blur-2xl">
      <a
        class="group block border-b border-white/10"
        [href]="env.company.websiteUrl"
        target="_blank"
        rel="noopener noreferrer"
        [attr.aria-label]="'Acessar site: ' + env.company.websiteUrl"
      >
        <div class="h-24 bg-gradient-to-b from-white/95 to-emerald-50/90">
          <img
            class="h-full w-full object-cover"
            [src]="env.assets.logoTheOne"
            alt="The One Software"
          />
        </div>
      </a>

      <div class="px-10 pb-10 pt-8">
        <header class="text-left mb-8">
          <h1 class="text-3xl font-semibold tracking-tight text-white mb-2">Bem-vindo de volta</h1>
          <p class="text-slate-400">Entre com suas credenciais para acessar o painel</p>
        </header>

        <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="flex flex-col gap-2">
        
        <ds-form-field [error]="emailError">
          <ds-input 
            label="E-mail" 
            placeholder="exemplo@email.com" 
            formControlName="email">
          </ds-input>
        </ds-form-field>

        <ds-form-field [error]="passwordError">
          <ds-input 
            label="Senha" 
            type="password" 
            placeholder="••••••••" 
            formControlName="password">
          </ds-input>
        </ds-form-field>

        <div class="flex justify-end mb-4">
          <a routerLink="/forgot-password" class="text-sm text-blue-400 hover:underline">Esqueceu a senha?</a>
        </div>

        <button ds-button class="primary w-full py-4 text-lg">
          Acessar Sistema
        </button>
      </form>

      <footer class="mt-8 text-center">
        <p class="text-slate-500">Não tem uma conta? 
          <a routerLink="/register" class="text-white font-medium hover:text-blue-400 transition-colors">Criar agora</a>
        </p>
      </footer>
      </div>
    </div>
  </div>
</div>

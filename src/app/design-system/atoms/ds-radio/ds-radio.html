<label class="flex items-center gap-3 cursor-pointer group">
    <div class="relative flex items-center justify-center">
      <input 
        type="radio" 
        [checked]="value() === radioValue" 
        [disabled]="disabled()"
        (change)="select()"
        class="sr-only peer"
      >
      
      <div class="w-6 h-6 rounded-full border-2 border-white/20 bg-white/5 backdrop-blur-md
                  transition-all duration-300 group-hover:border-blue-400/50
                  peer-checked:border-blue-500">
      </div>
      
      <div class="absolute w-3 h-3 rounded-full bg-blue-500 scale-0 transition-transform duration-300
                  peer-checked:scale-100 shadow-[0_0_12px_rgba(59,130,246,0.5)]">
      </div>
    </div>
    
    <span class="text-sm font-medium text-slate-300">{{ label }}</span>
  </label>

<label class="flex items-center gap-3 cursor-pointer group">
    <div class="relative">
      <input type="checkbox" [checked]="value()" [disabled]="disabled()" (change)="toggle()" class="sr-only peer">
      
      <div class="w-11 h-6 bg-white/10 border border-white/10 rounded-full peer backdrop-blur-md
                  transition-all duration-300 peer-checked:bg-blue-500 peer-checked:border-blue-400">
      </div>
      
      <div class="absolute left-[2px] top-[2px] w-5 h-5 bg-white rounded-full transition-all duration-300
                  peer-checked:translate-x-full peer-checked:bg-white shadow-lg">
      </div>
    </div>
    <span class="text-sm font-medium text-slate-300">{{ label }}</span>
  </label>

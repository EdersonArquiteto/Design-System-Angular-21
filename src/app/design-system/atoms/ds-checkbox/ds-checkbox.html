<label class="flex items-center gap-3 cursor-pointer group">
    <div class="relative flex items-center justify-center">
      <input
        type="checkbox"
        [checked]="value()"
        [disabled]="disabled()"
        (change)="toggle()"
        class="peer sr-only" 
      />
      <div class="w-6 h-6 border-2 border-white/20 rounded-md bg-white/5 backdrop-blur-md 
                  transition-all duration-300
                  peer-checked:bg-blue-500 peer-checked:border-blue-500
                  group-hover:border-blue-400/50">
      </div>
      <svg 
        class="absolute w-4 h-4 text-white opacity-0 transition-opacity peer-checked:opacity-100" 
        fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7" />
      </svg>
    </div>
    
    <span class="text-slate-300 text-sm font-medium">{{ label }}</span>
  </label>

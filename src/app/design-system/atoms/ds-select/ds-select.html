<div class="flex flex-col gap-1.5 w-full">
    <label *ngIf="label" class="text-sm font-medium text-slate-300 ml-1">{{ label }}</label>
    <select
      [value]="value()"
      (change)="onChangeSelect($event)"
      class="w-full bg-slate-900 border border-white/10 rounded-xl px-4 py-3 
             text-white outline-none appearance-none cursor-pointer focus:border-blue-500/50"
    >
      <option value="" disabled selected>{{ placeholder }}</option>
      <option *ngFor="let opt of options" [value]="opt.value" class="bg-slate-900">
        {{ opt.label }}
      </option>
    </select>
  </div>

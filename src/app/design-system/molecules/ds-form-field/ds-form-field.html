<div class="flex flex-col gap-1 w-full mb-4">
    <ng-content></ng-content>

    <div class="h-5">
      @if (error) {
        <span class="text-red-400 text-xs font-medium animate-pulse ml-1">
          {{ error }}
        </span>
      } @else if (hint) {
        <span class="text-slate-500 text-xs ml-1">{{ hint }}</span>
      }
    </div>
  </div>

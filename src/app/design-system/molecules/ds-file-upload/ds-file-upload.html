<div class="w-full flex flex-col gap-2">
    <label *ngIf="label" class="text-sm font-medium text-slate-300 ml-1">{{ label }}</label>
    
    <div 
      dsDragDrop 
      (fileDropped)="onFileDropped($event)"
      (click)="fileInput.click()"
      class="relative h-48 border-2 border-dashed border-white/10 rounded-[2rem] bg-white/[0.02] backdrop-blur-xl 
             flex flex-col items-center justify-center cursor-pointer transition-all duration-300 hover:border-blue-500/50 hover:bg-white/[0.05]">
      
      <input type="file" #fileInput class="hidden" (change)="onFileSelected($event)" [multiple]="multiple">
      
      <div class="p-4 bg-blue-500/10 rounded-full text-blue-400 mb-4">
        <svg class="w-8 h-8" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12" />
        </svg>
      </div>

      <p class="text-slate-300 font-medium">Arraste arquivos ou <span class="text-blue-400">clique para buscar</span></p>
      <p class="text-slate-500 text-xs mt-1">Arquivos suportados: {{ accept }}</p>
    </div>

    <ul class="mt-4 space-y-2" *ngIf="files().length > 0">
      <li *ngFor="let file of files(); let i = index" 
          class="flex items-center justify-between p-3 bg-white/5 border border-white/10 rounded-xl animate-in slide-in-from-left duration-300">
        <div class="flex items-center gap-3">
          <div class="p-2 bg-slate-800 rounded-lg text-slate-400">
             <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" /></svg>
          </div>
          <div class="flex flex-col">
            <span class="text-sm text-slate-200 truncate max-w-[200px]">{{ file.name }}</span>
            <span class="text-xs text-slate-500">{{ (file.size / 1024).toFixed(1) }} KB</span>
          </div>
        </div>
        <button (click)="removeFile(i)" class="p-2 text-slate-500 hover:text-red-400 transition-colors">
          <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path d="M6 18L18 6M6 6l12 12" /></svg>
        </button>
      </li>
    </ul>
  </div>

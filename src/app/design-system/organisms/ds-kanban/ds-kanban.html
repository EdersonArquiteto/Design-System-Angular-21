<div class="flex gap-6 overflow-x-auto pb-4 h-[600px]" cdkDropListGroup>
    @for (column of columns(); track column.id) {
      <div class="flex-shrink-0 w-80 flex flex-col gap-4">
        <div class="flex justify-between items-center px-2">
          <h3 class="text-white font-bold uppercase tracking-wider text-sm">{{ column.title }}</h3>
          <span class="bg-white/10 px-2 py-0.5 rounded text-xs text-slate-400">{{ column.items.length }}</span>
        </div>

        <div
          cdkDropList
          [cdkDropListData]="column.items"
          (cdkDropListDropped)="drop($event)"
          class="flex-1 bg-white/[0.02] border border-white/5 rounded-[2rem] p-4 min-h-[150px] backdrop-blur-md transition-colors hover:bg-white/[0.04]">
          
          @for (item of column.items; track item.id) {
            <div cdkDrag class="bg-slate-900 border border-white/10 p-4 rounded-2xl mb-3 shadow-xl cursor-grab active:cursor-grabbing hover:border-blue-500/50 transition-all">
              <p class="text-slate-200 text-sm mb-3">{{ item.content }}</p>
              <div class="flex justify-between items-center">
                 <div class="w-6 h-6 rounded-full bg-gradient-to-tr from-blue-500 to-purple-500 border border-white/20"></div>
                 <span class="text-[10px] text-slate-500 font-mono">#{{ item.id }}</span>
              </div>
            </div>
          }
        </div>
      </div>
    }
  </div>
